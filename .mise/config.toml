[tools]
node = "24.22.0"
pnpm = "12.14.0"
zizmor = "1.30.1"
shfmt = "3.14.1"
stylua = "2.6.0"
shellcheck = "0.11.0"

[settings]
minimum_release_age = "7d"

[tasks.install]
description = "Install pnpm dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.typecheck]
description = "Typecheck TypeScript"
depends = ["install"]
run = "pnpm exec tsc -p tsconfig.json --noEmit"

[tasks.lint]
description = "Lint TypeScript, JavaScript, shell, and workflows"
depends = ["install"]
run = "node scripts/lint.mjs"

[tasks.build]
description = "Build workspace packages"
depends = ["install"]
run = "pnpm -r --if-present build"

[tasks.test]
description = "Build packages and run tests"
depends = ["build"]
run = "pnpm -r --if-present test"

[tasks.format]
description = "Check formatting"
depends = ["install"]
run = "node scripts/format.mjs check"

[tasks.format-fix]
description = "Write formatting"
depends = ["install"]
run = "node scripts/format.mjs write"
