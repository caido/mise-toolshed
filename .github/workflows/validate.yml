name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Typecheck
        run: mise run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Lint
        run: mise run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Build
        run: mise run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Test
        run: mise run test

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Format
        run: mise run format

  plugin-smoke-test:
    name: Plugin smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Link toolshed plugin
        run: mise plugins link --force toolshed .

      - name: Install get-skills
        run: mise install toolshed:get-skills@latest

      - name: Check get-skills on PATH
        run: mise exec toolshed:get-skills@latest -- sh -c 'command -v get-skills'

  windows-tools:
    name: Windows tools
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}
          install: false

      - name: Link toolshed plugin
        shell: pwsh
        run: mise plugins link --force toolshed .

      - name: List released versions
        shell: pwsh
        run: |
          function Remote-Versions([string]$tool) {
            $raw = @(mise ls-remote "toolshed:${tool}")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            return @($raw | Out-String -Stream | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" })
          }
          $exact = @(Remote-Versions "check-exact-versions")
          if ($exact -notcontains "1.0.0") { Write-Error "missing 1.0.0 in [$exact]"; exit 1 }
          $age = @(Remote-Versions "check-minimum-release-age")
          if ($age -notcontains "1.0.1") { Write-Error "missing 1.0.1 in [$age]"; exit 1 }
          $locks = @(Remote-Versions "check-lockfiles")
          if ($locks -notcontains "1.0.1") { Write-Error "missing 1.0.1 in [$locks]"; exit 1 }

      - name: Install node
        shell: pwsh
        run: |
          mise install node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install released tools
        shell: pwsh
        run: |
          mise install toolshed:check-exact-versions@1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise install toolshed:check-minimum-release-age@1.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise install toolshed:check-lockfiles@1.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run released tools
        shell: pwsh
        run: |
          function Assert-Version([string]$tool, [string]$version) {
            $got = @(mise exec node "toolshed:${tool}@${version}" -- $tool --version)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $text = ($got | Out-String).Trim()
            if ($text -ne $version) { Write-Error "${tool} printed [$text]"; exit 1 }
            Write-Output "${tool} ${text}"
          }
          Assert-Version "check-exact-versions" "1.0.0"
          Assert-Version "check-minimum-release-age" "1.0.1"
          Assert-Version "check-lockfiles" "1.0.1"
          Write-Output "fresh bin: check-exact-versions 1.0.0"

      - name: Reinstall when bin already exists
        shell: pwsh
        run: |
          $raw = @(mise where "toolshed:check-exact-versions@1.0.0")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $where = @($raw | Out-String -Stream | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" } | Select-Object -Last 1)
          $bin = Join-Path $where "bin"
          $tool = Join-Path $bin "check-exact-versions"
          Set-Content -Path $tool -Value "stale" -NoNewline
          $keep = Join-Path $bin ".keep"
          Set-Content -Path $keep -Value "keep" -NoNewline
          # mise deletes install_path before the plugin runs. Holding .keep open
          # makes that delete fail, so the copy runs against a bin that already exists.
          $stream = [System.IO.File]::Open(
            $keep,
            [System.IO.FileMode]::Open,
            [System.IO.FileAccess]::Read,
            [System.IO.FileShare]::Read
          )
          try {
            mise install --force "toolshed:check-exact-versions@1.0.0"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $stream.Dispose()
          }
          if (-not (Test-Path -LiteralPath $keep)) {
            Write-Error "bin was recreated, so this did not install into an existing directory"
            exit 1
          }
          $got = @(mise exec node "toolshed:check-exact-versions@1.0.0" -- check-exact-versions --version)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = ($got | Out-String).Trim()
          if ($text -ne "1.0.0") { Write-Error "existing bin install printed [$text]"; exit 1 }
          Write-Output "existing bin: check-exact-versions $text"

  pins:
    name: Pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build
        run: mise exec -- pnpm -r --if-present build

      - name: Check pins
        run: |
          mise exec -- node packages/check-exact-versions/dist/check-exact-versions.mjs
          mise exec -- node packages/check-lockfiles/dist/check-lockfiles.mjs
          mise exec -- node packages/check-minimum-release-age/dist/check-minimum-release-age.mjs
