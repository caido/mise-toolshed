name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Typecheck
        run: mise run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Lint
        run: mise run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Build
        run: mise run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Test
        run: mise run test

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Format
        run: mise run format

  plugin-smoke-test:
    name: Plugin smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Link toolshed plugin
        run: mise plugins link --force toolshed .

      - name: Install get-skills
        run: mise install toolshed:get-skills@latest

      - name: Check get-skills on PATH
        run: mise exec toolshed:get-skills@latest -- sh -c 'command -v get-skills'

  test-plugin:
    name: Test plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}
          install: false

      - name: List versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node test/plugin/ls-remote.mjs

      - name: Fresh install
        run: node test/plugin/fresh-install.mjs

      - name: Install with a space in the path
        run: node test/plugin/space-in-path.mjs

      - name: Latest
        run: node test/plugin/latest.mjs

      - name: Reinstall
        run: node test/plugin/reinstall.mjs

      - name: Upgrade
        run: node test/plugin/upgrade.mjs

      - name: Uninstall
        run: node test/plugin/uninstall.mjs

      - name: Checksum mismatch
        run: node test/plugin/checksum-mismatch.mjs

      - name: Missing release
        run: node test/plugin/missing-release.mjs

      - name: Link toolshed plugin
        run: mise plugins link --force toolshed .

      - name: Install the released-tools fixture from its lockfile
        working-directory: test/fixtures/released-tools
        env:
          MISE_CEILING_PATHS: ${{ github.workspace }}/test/fixtures
        run: mise install

      - name: Run the released tools
        env:
          MISE_CEILING_PATHS: ${{ github.workspace }}/test/fixtures
        run: node scripts/released-fixture.mjs --run

  pins:
    name: Pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build
        run: mise exec -- pnpm -r --if-present build

      - name: Check pins
        run: |
          mise exec -- node packages/check-exact-versions/dist/check-exact-versions.mjs
          mise exec -- node packages/check-lockfiles/dist/check-lockfiles.mjs
          mise exec -- node packages/check-minimum-release-age/dist/check-minimum-release-age.mjs
