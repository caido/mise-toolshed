name: Release

on:
  pull_request:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      tool:
        description: Workspace package directory under packages/
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Plan test tag
        run: mise exec -- sh scripts/check-release-plan.sh

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build
        run: mise exec -- pnpm -r build

      - name: Checksum
        run: |
          mise exec -- sh scripts/stage-release.sh check-exact-versions "$RUNNER_TEMP/check-exact-versions"
          mise exec -- sh scripts/stage-release.sh check-lockfiles "$RUNNER_TEMP/check-lockfiles"
          mise exec -- sh scripts/stage-release.sh check-minimum-release-age "$RUNNER_TEMP/check-minimum-release-age"

  plan:
    name: Plan release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.tag.outputs.action || steps.dispatch.outputs.action }}
      tool: ${{ steps.tag.outputs.tool || steps.dispatch.outputs.tool }}
      tag: ${{ steps.tag.outputs.tag || steps.dispatch.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Plan tag push
        id: tag
        if: github.event_name == 'push'
        run: mise exec -- sh scripts/export-release-plan.sh

      - name: Plan dispatch
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          TOOL: ${{ inputs.tool }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- sh scripts/plan-dispatch.sh

  publish:
    name: Publish
    needs: plan
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build
        run: mise exec -- pnpm -r build

      - name: Stage assets
        env:
          TOOL: ${{ needs.plan.outputs.tool }}
        run: mise exec -- sh scripts/stage-release.sh "$TOOL" "$RUNNER_TEMP/release"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: mise exec -- sh scripts/create-release-tag.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ needs.plan.outputs.tool }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: mise exec -- sh scripts/publish-release.sh
